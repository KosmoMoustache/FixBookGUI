modLoader = "javafml"
loaderVersion = "*"
license = "${mod_license}"
issueTrackerURL = "${mod_github}/issues"


[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "KosmoMoustache"
description = "${mod_description}"
logoFile = "icon.png"
logoBlur = false

[[mixins]]
config = "${mod_id}-neoforge.mixins.json"

[[mixins]]
config = "${mod_id}-common.mixins.json"

[[dependencies.$mod_id]]
modId = "neoforge"
type = "required"
versionRange = "[$neoforge,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.$mod_id]]
modId = "minecraft"
type = "required"
versionRange = "$neoforge_mc_range"
ordering = "NONE"
side = "BOTH"
